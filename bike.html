<html>
<head>

	<title>Object Detection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.0.0/p5.js"></script>

  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  
  <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body background="background.jpg">
  <center>
    <h1 class="btn btn-info heading">Object Detection</h1>
    <h3 id="status" class="btn btn-danger"></h3>
  </center>


<script>
img = "";
status = "";
objects = [];

function preload(){
    img = loadImage("bike.jpg");
}

function setup(){
    canvas = createCanvas(640, 420);
    canvas.center();
    objectDetector = ml5.objectDetector('cocossd', modelLoaded);
    document.getElementById("status").innerHTML = "Status: Detecting objects";
}

function modelLoaded(){
    console.log("Model Loaded!");
    status = true;
    objectDetector.detect(img, gotResults);
}

function gotResults(error, results){
    if(error){
        console.log(error);
        return;
    }
    console.log(results);
    objects = results;
    document.getElementById("status").innerHTML = "Status: " + objects.length + " object(s) detected";
}

function draw(){
    image(img, 0, 0, 640, 420);
    // the model works on the original image size, so scale its boxes to the 640x420 canvas
    scaleX = 640 / img.width;
    scaleY = 420 / img.height;
    for(i = 0; i < objects.length; i++){
        percent = floor(objects[i].confidence * 100);
        fill("#FF0000");
        noStroke();
        text(objects[i].label + " " + percent + "%", objects[i].x * scaleX + 15, objects[i].y * scaleY + 15);
        noFill();
        stroke("#FF0000");
        rect(objects[i].x * scaleX, objects[i].y * scaleY, objects[i].width * scaleX, objects[i].height * scaleY);
    }
}
</script>
</body>
</html>
